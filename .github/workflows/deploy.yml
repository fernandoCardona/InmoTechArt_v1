name: CI/CD — Test & Deploy to VPS

# ============================================================
# FLUJO COMPLETO:
#  push a main
#    → Job 1: Tests unitarios (Jest) — SIN servidor
#    → Job 2: Tests E2E (Playwright) — CON servidor + BD de prueba
#    → Job 3: Deploy en Dokploy (solo si ambos jobs pasan)
#
# SECRETS requeridos en GitHub (Settings → Secrets and variables → Actions):
#   - DOKPLOY_WEBHOOK_URL   → URL del webhook de Dokploy
#   - DOKPLOY_WEBHOOK_TOKEN → Token Bearer del webhook
# ============================================================

on:
  push:
    branches:
      - main

jobs:
  # ------------------------------------------------------------
  # JOB 1: TESTS UNITARIOS (Jest)
  # No necesita BD ni servidor. Rápido y ligero.
  # ------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: ./app
        run: npm ci

      - name: Ejecutar tests unitarios
        working-directory: ./app
        run: npm test -- --passWithNoTests --ci --coverage
        env:
          # Variables mínimas necesarias para que los módulos carguen
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: ci_test_secret_not_real_32chars_min
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ------------------------------------------------------------
  # JOB 2: TESTS E2E (Playwright)
  # Requiere: PostgreSQL de prueba + build de la app + servidor.
  # Se ejecuta en paralelo con unit-tests.
  # ------------------------------------------------------------
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    # Servicio PostgreSQL de prueba (aislado del de producción)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neretxaus_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: ./app
        run: npm ci

      - name: Inicializar schema de BD de prueba
        run: |
          PGPASSWORD=test_password psql \
            -h localhost -U test_user -d neretxaus_test \
            -f infra/db/01-init-schema.sql

      - name: Construir la aplicación Next.js
        working-directory: ./app
        run: npm run build
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/neretxaus_test
          AUTH_SECRET: ci_test_secret_mínimo_32_chars_obligatorio
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Ollama y Qdrant no disponibles en CI: los tests E2E mockean estas dependencias
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: ci-mock-key
          OLLAMA_BASE_URL: http://localhost:11434

      - name: Iniciar servidor Next.js en background
        working-directory: ./app
        run: npm start &
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/neretxaus_test
          AUTH_SECRET: ci_test_secret_mínimo_32_chars_obligatorio
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PORT: 3000

      - name: Esperar a que el servidor esté disponible (máx. 60s)
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Instalar navegadores Playwright (solo Chromium para CI)
        working-directory: ./app
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        working-directory: ./app
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Subir reporte de Playwright si hay fallos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------
  # JOB 3: DESPLIEGUE EN DOKPLOY
  # Solo se ejecuta si AMBOS jobs anteriores pasan.
  # ------------------------------------------------------------
  deploy:
    name: Deploy to VPS (Dokploy)
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: success()

    steps:
      - name: Notificar a Dokploy para redesplegar
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_WEBHOOK_TOKEN }}" \
            --fail \
            --silent \
            --show-error
          echo "✅ Deploy disparado en Dokploy"
